[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keyboard-to-controller-emulator"
version = "0.6.3"
description = "Map keyboard input to virtual Xbox 360 / DS4 controllers on Windows via ViGEmBus"
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "the k2c maintainers" }]
keywords = ["input", "emulator", "xinput", "vigem", "controller", "keyboard", "gamepad"]

dependencies = [
    "vgamepad==0.0.8",
    "pydantic==2.7.4",
    "pynput==1.7.7",
    "pywin32==306",
    "tomli-w==1.0.0",
    "tomli==2.0.1",
    "rich==13.7.1",
    "structlog==24.1.0",
]

[project.optional-dependencies]
ui = ["pygame==2.5.2"]
dev = ["pytest==8.2.2", "pytest-asyncio==0.23.7"]

[project.scripts]
k2c = "emulator.bootstrap.app:main"

[tool.setuptools.packages.find]
include = ["emulator*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"